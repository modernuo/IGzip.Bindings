name: Build native libraries

# Builds the bundled ISA-L binaries from a pinned upstream tag. Download the artifacts and commit them to
# IGzip.Bindings/runtimes/<rid>/native/, and update THIRD-PARTY-NOTICES.md when the tag changes.

on:
  workflow_dispatch:
    inputs:
      isal_ref:
        description: intel/isa-l tag to build
        default: v2.32.1
        required: true

permissions:
  contents: read

jobs:
  win-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: intel/isa-l
          ref: ${{ inputs.isal_ref }}

      - uses: ilammy/setup-nasm@v1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build isa-l.dll
        shell: cmd
        run: |
          if not exist bin mkdir bin
          nmake -nologo -f Makefile.nmake isa-l.dll

      # Must load on a bare server: no VC++ redistributable, only system DLLs.
      - name: Check dependencies and exports
        shell: pwsh
        run: |
          $deps = (dumpbin /nologo /dependents isa-l.dll | Select-String '\.dll' | ForEach-Object { $_.Line.Trim() }) | Where-Object { $_ -ne 'isa-l.dll' -and $_ -notmatch '^Dump of file' }
          $deps
          if ($deps | Where-Object { $_ -notmatch '^(KERNEL32|ntdll)\.dll$' }) { throw "unexpected dependency" }
          $exports = dumpbin /nologo /exports isa-l.dll | Out-String
          foreach ($fn in 'isal_deflate_stateless_init', 'isal_deflate_stateless', 'isal_inflate_init', 'isal_inflate_stateless') {
            if ($exports -notmatch "\b$fn\b") { throw "missing export $fn" }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: win-x64
          path: isa-l.dll
          if-no-files-found: error

  osx-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: intel/isa-l
          ref: ${{ inputs.isal_ref }}

      - name: Install build tools
        run: brew install autoconf automake libtool

      - name: Build libisal
        run: |
          ./autogen.sh
          # A /usr/local install name makes the linker treat the dylib as shared-cache eligible and reject
          # libtool's -undefined dynamic_lookup; Homebrew avoids it the same way, with its own prefix.
          ./configure --prefix="$PWD/out"
          make -j"$(sysctl -n hw.ncpu)"
          cp "$(readlink -f .libs/libisal.dylib)" libisal.dylib
          # Loaded by full path from runtimes/osx-arm64/native, never through an install name.
          install_name_tool -id @rpath/libisal.dylib libisal.dylib

      - name: Check architecture, dependencies and exports
        run: |
          file libisal.dylib
          lipo -archs libisal.dylib | grep -qx arm64
          otool -L libisal.dylib
          if otool -L libisal.dylib | tail -n +2 | grep -v -e '/usr/lib/' -e '@rpath/libisal.dylib'; then
            echo "unexpected dependency" >&2
            exit 1
          fi
          for fn in isal_deflate_stateless_init isal_deflate_stateless isal_inflate_init isal_inflate_stateless; do
            nm -gU libisal.dylib | grep -q " _$fn\$" || { echo "missing export $fn" >&2; exit 1; }
          done

      - uses: actions/upload-artifact@v7
        with:
          name: osx-arm64
          path: libisal.dylib
          if-no-files-found: error
